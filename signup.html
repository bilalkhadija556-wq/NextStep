
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | NextStep</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <section class="signup-section">

        <div class="signup-card">

            <a href="index.html" class="signup-brand">
                🎓 NextStep<span>.</span>
            </a>

            <h2>Create Your Account</h2>

            <p class="signup-description">
                Join NextStep and discover opportunities for your future.
            </p>

            <form>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control"
                               placeholder="Enter your full name">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control"
                               placeholder="Enter your email">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control"
                               placeholder="Create a password">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control"
                               placeholder="Confirm your password">
                    </div>

                    <div class="col-12 mb-3">
                        <label class="form-label">Degree / Program</label>
                        <input type="text" class="form-control"
                               placeholder="e.g. BS Software Engineering">
                    </div>

                    <div class="col-12 mb-4">
                        <label class="form-label">University</label>
                        <input type="text" class="form-control"
                               placeholder="Enter your university">
                    </div>

                </div>

                <button type="submit" class="btn signup-btn w-100">
                    Create Account
                </button>

            </form>

            <p class="login-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
